[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-cpp"
version = "0.21.0"
authors = [
    { name = "Kristoffer H. Andersen", email = "kristoffer_andersen@outlook.com" },
]
description = "A minimal python wrapping of OCCT using nanobind"
readme = "README.md"
# Matches conda/recipe.yaml's `license:` and the classifier below. The project had only the
# classifier and no LICENSE file at all, which is a weak claim to a licence: the grant terms were
# not actually stated anywhere, while every vendored dep under third_party/ carried its own text.
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# numpy is NOT optional: the mesh/stream API hands back zero-copy nb::ndarray<nb::numpy, ...> views
# (Mesh.positions, Mesh.indices, the NGEOM stream buffers), so touching any result imports numpy.
# Leaving it undeclared was invisible natively — conda always has numpy — but under pyodide micropip
# installs exactly what is declared, and reading Mesh.indices without numpy does NOT raise
# ImportError: it recurses until the interpreter dies with "Maximum call stack size exceeded".
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.urls]
"Homepage" = "https://github.com/Krande/adacpp"
"Bug Tracker" = "https://github.com/Krande/adacpp/issues"


















[tool.setuptools]
packages = ["adacpp"]

[tool.setuptools.package-dir]
adacpp = "src/adacpp"

[tool.black]
line-length = 120
# Same target as isort's py_version and the 3.10 ruff resolves from
# requires-python. Left unset, black 26 infers a much newer target and warns
# "Python 3.12 cannot parse code formatted for Python 3.15", which disables its
# AST-equivalence safety check — the check that proves a reformat did not change
# the code's meaning. Keep all three tools on one target.
target-version = ["py310"]
# build/ holds CMake FetchContent deps (manifold, etc.) and third_party/ is vendored;
# black already skips build/ via its default exclude, force-exclude keeps third_party out too.
force-exclude = "(^|/)(build|third_party)/"

[tool.ruff]
line-length = 120
exclude = ["examples/", ".pixi/", "temp/", "node_modules/", "output/", "build/", "third_party/"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.ruff.lint.isort]
# adacpp._ada_cpp_ext_impl is the compiled extension: it has no directory under
# src/, so ruff's src-based first-party detection files it as THIRD-party while
# plain `adacpp` (which does have src/adacpp/) comes out first-party. isort puts
# both in first-party. `pixi run lint` is isort THEN ruff --fix, so they undid
# each other on tests/py/test_cad_api_generated.py every run. Naming the package
# settles it for both.
known-first-party = ["adacpp"]

[tool.isort]
profile = "black"
# Match the Python that ruff resolves from `requires-python = ">=3.10"` above.
# Without this isort uses the interpreter it runs under (3.12 in the lint env)
# and classifies `tomllib` as stdlib, while ruff's import rules target 3.10 and
# call it third-party. `pixi run lint` is isort THEN ruff --fix, so the two
# fought over tools/build_wheel.py: isort moved the import up, ruff moved it
# back, the task was not idempotent, and lint-check could never pass.
py_version = 310
skip = [".pixi", "node_modules", "temp", "output", "build", "third_party"]
skip_glob = ["**/node_modules/**", "**/temp/**", "**/output/**", "**/build/**", "**/third_party/**"]