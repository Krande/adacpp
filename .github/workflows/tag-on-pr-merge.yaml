name: Create Tag on PR Merge

# Thin wrapper: the release decision and the semantic-release invocation live in
# the `deputy` package (https://github.com/Krande/deputy). On a merged PR it
# reads the release-* label and, when a release is warranted, bumps the version,
# updates CHANGELOG.md, creates a vX.Y.Z tag, pushes it, and cuts a GitHub
# Release.
#
# The version location comes from deputy.toml's [release] table
# (pyproject.toml:project.version); conda/recipe.yaml reads that same field, so
# the conda package version follows automatically.
#
# The bump commit and tag are pushed over SSH with the SOURCE_KEY deploy key, NOT
# the default GITHUB_TOKEN. Two reasons: the push has to land on protected main,
# and a GITHUB_TOKEN-pushed tag does not trigger other workflows whereas a
# deploy-key push does. Nothing listens for tag pushes today — the workflow that
# used to, release-on-new-tag.yaml, skipped every one of its publish jobs and was
# removed with action_config.toml — but keeping the deploy-key push means adding
# a real tag-triggered publish workflow later just works. Wired via
# `remote.ignore_token_for_push` in deputy's defaults: semantic-release pushes
# over the `origin` remote the checkout points at (SSH + SOURCE_KEY) and uses
# GH_TOKEN only for the Release API call.
#
# Requirements:
#   * secrets.SOURCE_KEY — a deploy key with WRITE access to this repo.
#   * Do not enable "Do not allow bypassing the above settings" in branch
#     protection, or the deploy-key push is rejected and no tag is created.
#
# Pinned to deputy @v0.5.6 (see pr-review.yaml for what 0.5.6 fixed).

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  tag:
    name: Tag release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history; deploy-key auth so the tag push triggers CI)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # base branch (main) — the merge is already in
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release@users.noreply.github.com"

      - name: Install deputy
        # deputy pins gitpython<3.1.60 itself from v0.5.2 — do not re-add it here.
        run: pip install "deputy @ git+https://github.com/Krande/deputy.git@v0.5.6"

      - name: Tag + release per the PR's release label
        run: deputy tag-on-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
