# TEMPORARY: native backtrace of the macOS abort in read_ifc_file (ifcopenshell 0.9 port). Remove before merge.
name: tmp-macos-debug
on:
  push:
    branches: [feat/ifcopenshell-0.9]
jobs:
  debug:
    runs-on: macos-15
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          environments: conda
          cache: true
      - name: build package (no tests)
        run: pixi run -e conda rattler-build build -r conda/recipe.yaml --experimental --test skip --output-dir output
      - name: backtrace
        run: |
          set -x
          ls output/osx-arm64
          cat > repro.py <<'PY'
          import faulthandler, sys; faulthandler.enable()
          import ifcopenshell
          print("ifcopenshell", ifcopenshell.version, ifcopenshell.get_plugin_search_paths(), flush=True)
          print("py open:", ifcopenshell.open("files/my_test.ifc").schema, flush=True)
          import adacpp.cadit.ifc as I
          print("adacpp read:", I.read_ifc_file("files/my_test.ifc"), flush=True)
          PY
          cat > lldb.cmds <<'LL'
          run
          bt all
          image list
          quit
          LL
          pixi exec -c ./output -c conda-forge --spec ada-cpp --spec python=3.12 -- bash -c 'python repro.py; echo "exit=$?"; otool -L $(python -c "import adacpp,glob,os;print(glob.glob(os.path.join(os.path.dirname(adacpp.__file__),\"_ada_cpp_ext_impl*.so\"))[0])"); lldb --batch -s lldb.cmds -- python repro.py' 2>&1 | grep -v "^\s*$" | head -400
