name: ci-tests

# bump 1
on:
  workflow_dispatch:

  push:

# Use concurrency to ensure that only one instance of this workflow is running at a time
concurrency:
  group: ci-tests-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CROOT_DIR: /home/runner/work/build
  ARTIFACTS_DIR: /home/runner/work/artifacts
  PKG_DIR: linux-64

jobs:

  build_test:
    # `test` resolves the newest ifcopenshell; `test-ifc085` holds the 0.8.x line, whose static
    # link path cmake/deps_ifc.cmake keeps while 0.9 is new. Names stay ada-cpp-test[-ifc085].
    name: ada-cpp-${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [test, test-ifc085]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Install OpenGL dependencies
      - name: Install OpenGL dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          environments: ${{ matrix.env }}
          cache: true

      - name: install package
        run: |
          pixi run -e ${{ matrix.env }} install

      - name: run tests
        run: |
          pixi run -e ${{ matrix.env }} test

      # The FEA kernels' native unit tests: standalone C++, built with the env's compiler ($CXX).
      - name: FEA kernel unit tests (C++)
        run: |
          pixi run -e ${{ matrix.env }} bash tests/fea/run.sh